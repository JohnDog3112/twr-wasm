<!DOCTYPE html>
<html>
    <head>
        <title>Screen Tests</title>

        <script type="importmap">
            {
                "imports": {
                    "twr-wasm": "../../lib-js/index.js"
                }
            }
        </script>
    </head>
    <body>
         <canvas id="screen" width="1500px" height="900px" tabindex="1"></canvas>

         <script type="module">
            "use strict";

            import {twrWasmModule, twrWasmModuleAsync, twrConsoleWindow, twrConsoleScreen} from "twr-wasm";

            const is_async = window.location.hash=="#async";

            const modCon = is_async ? twrWasmModuleAsync : twrWasmModule;


            import jsEventsLib from "../pong/out/jsEventsLib.js"  // libraries use default export
            const jsEventsLibInit=new jsEventsLib();  //will register itself

            // const windowCanvas = document.getElementById("window");
            // if (windowCanvas == undefined) throw new Error(`Window example: Couldn't find window canvas!`);
            // const windowConsole = new twrConsoleWindow(windowCanvas);
            const screenCanvas = document.getElementById("screen");
            if (screenCanvas == undefined) throw new Error(`Screen example: couldn't find screen canvas!`);
            const screenConsole = new twrConsoleScreen(screenCanvas);
            async function spawnWindowExample(wasmFiles, startFunc, windowTitle, bindWindow = true) {
               let modOptions = {
                  screen: screenConsole
               };
               if (bindWindow) {
                  const windowConsole = screenConsole.jsSpawnWindow(windowTitle);
                  const d2dCanvas = windowConsole.jsGetDrawCanvas();
                  modOptions.window = windowConsole;
                  modOptions.d2dcanvas = d2dCanvas;
                  console.log("id: ", d2dCanvas.id);
               }
               
               const mod = new modCon({io:modOptions});
               await mod.loadWasm(is_async ? wasmFiles.async : wasmFiles.sync);

               await mod.callC([startFunc]);

               return mod;
            }
            const windowWasmFiles = {
               async: "../window/window-a.wasm",
               sync: "../window/window.wasm"
            };
            spawnWindowExample(windowWasmFiles, "init", "Window Example (1)");
            spawnWindowExample(windowWasmFiles, "init", "Window Example (2)");
            const pongWasmFiles = {
               async: "../pong/entry-point-a.wasm",
               sync: "../pong/entry-point.wasm"
            };
            spawnWindowExample(pongWasmFiles, "initMenu", "Pong");
            const appSpawnerFiles = {
               async: "screen-a.wasm",
               sync: "screen.wasm"
            };
            spawnWindowExample(appSpawnerFiles, "init", "App Spawner", false)
         </script>
    </body>
</html>
